<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#273376" />
    <meta name="robots" content="noindex, nofollow" />
    <title>403 - Acceso restringido | INTU</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #273376;
        background: #f5f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .topbar {
        min-height: 72px;
        padding: 18px max(24px, calc((100vw - 1120px) / 2));
        display: flex;
        align-items: center;
        gap: 12px;
        background: #273376;
        color: #fff;
      }

      .mark {
        width: 10px;
        height: 34px;
        flex: 0 0 auto;
        border-radius: 2px;
        background: #ffc907;
      }

      .brand {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
      }

      .brand span {
        display: block;
        color: rgb(255 255 255 / 70%);
        font-size: 11px;
        font-weight: 400;
      }

      main {
        width: min(100% - 32px, 760px);
        margin: auto;
        padding: 64px 0;
      }

      .panel {
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid #e1e6f0;
        border-top: 5px solid #ffc907;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 16px 48px rgb(39 51 118 / 8%);
      }

      .code {
        margin: 0;
        color: #a70336;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 16px;
        font-size: clamp(30px, 6vw, 46px);
        line-height: 1.12;
      }

      .message {
        max-width: 560px;
        margin: 0;
        color: #4b5568;
        font-size: 16px;
        line-height: 1.7;
      }

      .actions {
        margin-top: 30px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .actions a {
        min-height: 46px;
        padding: 12px 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #273376;
        border-radius: 5px;
        color: #273376;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      .actions a.primary {
        background: #273376;
        color: #fff;
      }

      .actions a:hover {
        border-color: #a70336;
      }

      .actions a:focus-visible {
        outline: 3px solid #ffc907;
        outline-offset: 3px;
      }

      footer {
        padding: 18px 24px;
        border-top: 1px solid #e1e6f0;
        color: #667085;
        font-size: 12px;
        text-align: center;
      }

      @media (max-width: 480px) {
        .topbar {
          min-height: 64px;
          padding: 14px 20px;
        }

        main {
          padding: 36px 0;
        }

        .actions {
          flex-direction: column;
        }

        .actions a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <span class="mark" aria-hidden="true"></span>
      <p class="brand">
        INTU
        <span>Instituto Nacional de Tierras Urbanas</span>
      </p>
    </header>

    <main>
      <section class="panel" aria-labelledby="page-title">
        <p class="code">Error 403</p>
        <h1 id="page-title">Acceso restringido</h1>
        <p class="message">
          No tienes permiso para acceder a esta página.
        </p>
        <nav class="actions" aria-label="Opciones de navegación">
          <a class="primary" href="/">Volver al inicio</a>
        </nav>
      </section>
    </main>

    <footer>Instituto Nacional de Tierras Urbanas · INTU</footer>
  </body>
</html>
